<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <!-- Plan: a restrained olympiad-style black-on-white geometry figure; no decorative color, cards, shadows, or implied perpendicularity. The curved locus S is arbitrary, while the five distance segments remain visible. -->
  <title id="title">DD1 geometry configuration</title>
  <desc id="desc">A black and white geometry diagram showing X, Y, P1, P2, an arbitrary curved set S, and the segments XP1, YP1, YP2, XY, and P1P2.</desc>
  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Arbitrary closed-set trace S -->
  <path d="M120 645 C190 585 270 575 360 615 C450 690 520 680 600 620 C680 560 710 610 780 643 C900 700 1045 628 1165 570" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1175" y="565" font-family="Times New Roman, STIX Two Text, serif" font-size="32" font-style="italic" fill="#111111">S</text>

  <!-- Main distance segments -->
  <line x1="245" y1="190" x2="360" y2="615" stroke="#111111" stroke-width="3.5"/>
  <line x1="945" y1="225" x2="780" y2="643" stroke="#111111" stroke-width="3.5"/>
  <line x1="245" y1="190" x2="945" y2="225" stroke="#111111" stroke-width="3.5"/>
  <line x1="945" y1="225" x2="360" y2="615" stroke="#111111" stroke-width="3" stroke-dasharray="12 10"/>
  <path d="M360 615 Q570 745 780 643" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 10"/>

  <!-- Points -->
  <circle cx="245" cy="190" r="7" fill="#111111"/>
  <circle cx="945" cy="225" r="7" fill="#111111"/>
  <circle cx="360" cy="615" r="7" fill="#111111"/>
  <circle cx="780" cy="643" r="7" fill="#111111"/>

  <!-- Labels -->
  <g font-family="Times New Roman, STIX Two Text, serif" font-style="italic" fill="#111111">
    <text x="215" y="158" font-size="34">X</text>
    <text x="960" y="205" font-size="34">Y</text>
    <text x="330" y="672" font-size="31">P₁</text>
    <text x="790" y="700" font-size="31">P₂</text>

    <text x="560" y="203" font-size="29">XY</text>
    <text x="190" y="425" font-size="27" transform="rotate(75 190 425)">XP₁</text>
    <text x="860" y="450" font-size="27" transform="rotate(-70 860 450)">YP₂</text>
    <text x="600" y="400" font-size="27" transform="rotate(-34 600 400)">YP₁</text>
    <text x="545" y="734" font-size="27">P₁P₂</text>
  </g>

</svg>
