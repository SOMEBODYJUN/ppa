schema_version: '1.0'
snapshot_date: '2026-09-14'
layer: 整理层；不是新一轮研究验收
evidence_policy:
  PROVED:
    label: 项目内已证
    meaning: 指定命题有项目证明与明确审计；不是发表、形式化或优先权认证
  PENDING:
    label: 尚待闭合
    meaning: 候选、修复、合稿、优先权或适用性待核
  OBSTRUCTED:
    label: 指定路线受阻
    meaning: 精确作用域内的不可能性 / 反例，通常是有价值负结果
  ALREADY_COVERED:
    label: 旧机制覆盖
    meaning: 仅扣除已明确覆盖的主张；同文件其他命题分别判断
  REFERENCE:
    label: 来源 / 整理层
    meaning: 不赋予数学结论
  SUPERSEDED:
    label: 历史已替代
    meaning: 保留追溯，不作当前排序或验收
  NOT_EXECUTED:
    label: 本次未运行
    meaning: 纳入代码仅完成语法检查；未执行数学验证
