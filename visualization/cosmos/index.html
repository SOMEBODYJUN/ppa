function path(c){return`M${c.a.x},${c.a.y}Q${c.c.x},${c.c.y} ${c.b.x},${c.b.y}`;}
function boundary(n,toward){const dx=toward.x-n.x,dy=toward.y-n.y,d=Math.max(1,Math.hypot(dx,dy)),r=(V.visualBounds?.(n,C.orbitIds.indexOf(n.id))??n.r)+5;return{x:n.x+dx/d*r,y:n.y+dy/d*r};}
function updateRoutes(){for(const r of routeDOM){const j=C.junction(r.e,model),o=model.byId.get(r.e.output);r.j.setAttribute('transform',`translate(${j.x},${j.y})`);let inputPaths=[];r.e.inputs.forEach((id,i)=>{const c=C.curve(boundary(model.byId.get(id),j),j,i),p=path(c);r.paths[i].setAttribute('d',p);inputPaths.push(p);const q=C.at(c,(clock*.11+i*.23)%1);r.dots[i].setAttribute('cx',q.x);r.dots[i].setAttribute('cy',q.y);});const c=C.curve(j,boundary(o,j),1),p=path(c);r.out.setAttribute('d',p);r.hit.setAttribute('d',inputPaths.join(' ')+p);const t=(clock*.08+C.hash(r.e.id)%100/100)%1,scale=Math.min(2.4,Math.max(.55,.82/zoom.k)),q=C.shipWaypoint(c,t,model,scale*30),shipT=q.t,dx=2*((1-shipT)*(c.c.x-c.a.x)+shipT*(c.b.x-c.c.x)),dy=2*((1-shipT)*(c.c.y-c.a.y)+shipT*(c.b.y-c.c.y));r.ship.setAttribute('transform',`translate(${q.x},${q.y}) rotate(${Math.atan2(dy,dx)*180/Math.PI}) scale(${scale})`);r.ship.style.display=zoom.k<.22||!q.safe?'none':'';for(const dot of r.dots)dot.style.display=zoom.k<.22?'none':'';r.j.style.opacity=zoom.k<.2?'.45':'1';}}
function nodeHref(n){return n.file?'../../research/'+n.file:null;}
function selectNode(id){const n=model.byId.get(id);if(!n)return;selected={type:'node',id};const direct=model.edges.filter(e=>e.output===id||e.inputs.includes(id)),allBridges=C.crossSystemEdges(model,n.group),bridges=allBridges.filter(e=>!direct.includes(e)),statuses=[...new Set(model.edges.filter(e=>e.output===id).map(e=>e.status))];const kind={sun:'主定理恒星',planet:'核心对象 · 行星',moon:'独立对象 · 卫星',body:'研究节点',hazard:'关系障碍 · 请核反驳范围',galaxy:'开放研究方向'}[n.kind];$('detail').innerHTML=`<div class="detail-id">${esc(n.id)} / ${esc(n.group.toUpperCase())}</div><h2 class="detail-title">${esc(n.label)}</h2><span class="tag">${kind}</span>${n.id==='R02'?'<span class="tag">局部 J_G · 有限长度</span>':''}<p class="detail-lead">${n.id==='R02'?'整个太阳系承载 RLEB–PPA 主链。八个行星是定义、条件与估计的入口；轨道远近不表示证明顺序。':n.orbit?'此物件对应真实图节点。公转表示视觉分组/导航轨道（父对象 '+esc(n.orbit.parent)+'），不声称父子推论；数学依赖须通过下方合取超边核对。':'此节点保留原图身份。所属星域仅用于导航，不改变对象、量词或证明状态。'}</p>${nodeHref(n)?`<a class="detail-link" href="${esc(nodeHref(n))}" target="_blank" rel="noopener">打开规范正文 <span style="float:right">↗</span></a>`:'<p class="tag">隔离演示节点 · 无规范正文</p>'}<div class="section-label">本节点直接参与 <span>${direct.length} 条真实超边</span></div>${direct.slice(0,12).map(e=>`<button class="edge-card" data-edge="${esc(e.id)}"><b>${esc(e.id)}</b>${esc(e.relation)}<div>${esc(e.inputs.join(' ∧ '))} ${['refutes','limits'].includes(e.relation)?'⊣':'→'} ${esc(e.output)}</div><small>${esc(e.scope)}</small></button>`).join('')}${direct.length>12?'<p class="detail-lead">其余直接关系可搜索节点 ID。</p>':''}<div class="section-label">星域跨域桥 <span>${allBridges.length} 条；其中 ${bridges.length} 条不直接涉及此节点</span></div>${bridges.slice(0,10).map(e=>`<button class="edge-card bridge-card" data-edge="${esc(e.id)}"><b>${esc(e.id)}</b>${esc(e.relation)}<div>${esc(e.inputs.join(' ∧ '))} → ${esc(e.output)}</div></button>`).join('')}${bridges.length?'<p class="detail-lead">点击桥线可核完整合取输入、范围和证据状态。</p>':allBridges.length?'<p class="detail-lead">该星域的跨域超边已在上方本节点直接参与中列出。</p>':'<p class="detail-lead">原图中该星域暂无跨域超边；星域邻近与导航不构成数学关系。</p>'}<div class="section-label">证据原文 <span>不由天体造型推断</span></div><div class="definition">${statuses.length?statuses.map(esc).join('<br><br>'):'原图未给此节点单独状态。请查看规范正文与关联超边。'}</div>`;$('detail').querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>selectEdge(b.dataset.edge));makeRoutes();refreshLOD();}
function selectEdge(id){const e=model.edges.find(e=>e.id===id);if(!e)return;selected={type:'edge',id};$('detail').innerHTML=`<div class="detail-id">HYPEREDGE / ${esc(e.id)}</div><h2 class="detail-title">${esc(e.topic||'研究关系')}</h2><span class="tag">${esc(e.relation)}</span><p class="detail-lead">以下全部输入汇入同一 ∧ 枢纽。航船用于指示阅读方向，不表示证明已成立或算法正在迭代。</p><div class="section-label">全部合取输入 <span>${e.inputs.length} 项</span></div><div class="edge-inputs">${e.inputs.map((id,i)=>`${i?'<span>∧</span>':''}<button data-node="${esc(id)}">${esc(id)}</button>`).join('')}</div><div class="section-label">输出 / 被限制对象</div><div class="edge-inputs"><button data-node="${esc(e.output)}">${esc(e.output)}</button></div><div class="definition"><strong>适用范围 · 原文</strong>${esc(e.scope)}</div><div class="definition"><strong>证据状态 · 原文</strong>${esc(e.status)}</div><div class="definition"><strong>关系类型</strong>${esc(e.relation)}${['refutes','limits'].includes(e.relation)?'：不是正向证明；红色断续航道只标示原记录中的反驳或限制范围。':''}</div><a class="detail-link" href="../../research/HYPERGRAPH.md" target="_blank" rel="noopener">完整 Markdown 超边表 ↗</a>`;$('detail').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>focus(b.dataset.node));makeRoutes();refreshLOD();}
function buildFleetGallery(){
const catalog=V.shipCatalog||[];
$('fleet-gallery').hidden=!catalog.length;
$('fleet-catalog').innerHTML=catalog.map((craft,i)=>`<div class="fleet-card"><svg viewBox="-30 -22 60 44" aria-hidden="true"><g transform="scale(.55)">${V.ship('gallery-'+i,{type:craft.id})}</g></svg><b>${esc(craft.name||craft.id)}</b><svg class="fleet-closeup" viewBox="-30 -22 60 44" aria-hidden="true">${V.ship('gallery-'+i,{type:craft.id})}</svg></div>`).join('');
}
function buildSystemList(){$('count').textContent=`${model.nodes.length} 对象 · ${model.edges.length} 关系`;$('system-list').innerHTML=model.systems.map(s=>`<button data-system="${s.id}"><span style="background:${s.color}"></span>${s.name}<small>${model.nodes.filter(n=>n.group===s.id).length} 星 · ${C.crossSystemEdges(model,s.id).length} 桥</small></button>`).join('');$('system-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{systemFocus(b.dataset.system);if(innerWidth<800)document.body.classList.remove('panel-open');});}
function render(){if(running){model.time=clock;C.advanceSystems(model,systemSim);if(sim.alpha()>.006)sim.tick();}C.updateOrbits(model,clock);for(const {s,g,haze,swirl,glyph}of systemDOM){haze.setAttribute('transform',`translate(${s.x},${s.y})`);g.setAttribute('transform',`translate(${s.x},${s.y})`);swirl.setAttribute('transform',`translate(${s.x},${s.y})`);glyph.setAttribute('transform',`translate(${s.x},${s.y}) scale(${1/zoom.k}) rotate(${clock*.5})`);swirl.querySelector('.field-spin').setAttribute('transform',`rotate(${clock*(.3+C.hash(s.id)%3*.15)})`);}for(const {s,target,p}of navDOM)p.setAttribute('d',`M${s.x},${s.y}L${target.x},${target.y}`);for(const n of model.nodes){const d=nodeDOM.get(n.id);d.g.setAttribute('transform',`translate(${n.x},${n.y})`);if(d.orbit){const p=model.byId.get(n.orbit.parent);d.orbit.setAttribute('cx',p.x);d.orbit.setAttribute('cy',p.y);}if(d.spin)d.spin.setAttribute('transform',`rotate(${clock*(n.kind==='sun'?1:4)})`);}declutterSunLabels();updateRoutes();}
function loop(t){const dt=last?Math.min(.05,(t-last)/1000):0;last=t;if(running)clock+=dt*speed;render();frame++;requestAnimationFrame(loop);}
function resizeStars(){const c=$('stars'),r=devicePixelRatio||1,w=vp.clientWidth,h=vp.clientHeight;c.width=w*r;c.height=h*r;const ctx=c.getContext('2d');ctx.scale(r,r);ctx.fillStyle='#040914';ctx.fillRect(0,0,w,h);let rand=d3.randomLcg(.618);for(let i=0;i<Math.max(300,w*h/1700);i++){const x=rand()*w,y=rand()*h,z=rand(),rr=z>.97?1.2:rand()*.7+.12;ctx.globalAlpha=.14+rand()*.55;ctx.fillStyle=i%7===0?'#84abce':'#d0daec';ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();if(z>.994){ctx.globalAlpha=.16;ctx.fillRect(x-4,y-.25,8,.5);ctx.fillRect(x-.25,y-4,.5,8);}}ctx.globalAlpha=1;}
function setGraph(graph){C.validate(graph);const previous=model;model=C.make(graph,previous);sim=C.simulation(model).alpha(.48);systemSim=C.systemSimulation(model);clock=model.time;makeBackdrop();makeNavigation();makeNodes();buildSystemList();if(!model.byId.has(selected.id)&&selected.type==='node')selected={type:'node',id:model.byId.has('R02')?'R02':model.nodes[0]?.id};if(selected.type==='node')selectNode(selected.id);else if(model.edges.some(e=>e.id===selected.id))selectEdge(selected.id);else selectNode(model.byId.has('R02')?'R02':model.nodes[0]?.id);render();return {nodes:model.nodes.length,edges:model.edges.length};}
function growth(){demo++;const graph=JSON.parse(JSON.stringify(model.graph)),parent=selected.type==='node'?selected.id:'R01';for(let i=0;i<8;i++){const id=`DEMO-${demo}-${i}`;graph.nodes.push({id,label:`沙盒新增对象 ${demo}.${i}（非数学命题）`,file:''});graph.edges.push({id:`DEMO-E-${demo}-${i}`,topic:'隔离布局测试',inputs:i?[parent,`DEMO-${demo}-${i-1}`]:[parent],output:id,relation:'demo-only',scope:'虚构布局压力测试，不写入 research/graph.json',status:'sandbox-only'});}setGraph(graph);$('demo-banner').hidden=false;$('clear-demo').hidden=false;const n=model.byId.get(`DEMO-${demo}-0`),p=model.byId.get(parent);for(const q of model.nodes.filter(n=>n.id.startsWith(`DEMO-${demo}-`))){q.group=p.group;q.ax=p.x+100+Math.cos(C.hash(q.id))*100;q.ay=p.y+100+Math.sin(C.hash(q.id))*100;q.x=p.x;q.y=p.y;model.anchors[q.id]={x:q.ax,y:q.ay,system:q.group};}sim.alpha(.7);camera(p.x+80,p.y+50,1.35);toast('8 个隔离测试对象正在由排斥力、碰撞力与锚点力展开。原数学图不变。');}
function syncMotion(){document.body.classList.toggle('motion-paused',!running);$('motion').textContent=running?'Ⅱ':'▶';$('motion').title=running?'暂停公转与航行':'继续公转与航行';$('motion').setAttribute('aria-pressed',String(!running));}

$('home').onclick=solar;$('overview').onclick=overview;$('fit').onclick=overview;$('chain').onclick=()=>{solar();routeMode='related';$('routes-toggle').textContent='航道：关联';selectNode('R02');};$('zoom-in').onclick=()=>zoomBy(1.35);$('zoom-out').onclick=()=>zoomBy(1/1.35);$('motion').onclick=motion;$('speed').onclick=()=>{speed=speed===1?3:speed===3?.35:1;$('speed').textContent=speed+'×';};$('routes-toggle').onclick=()=>{routeMode=routeMode==='related'?'all':routeMode==='all'?'none':'related';$('routes-toggle').textContent='航道：'+({related:'关联',all:'全部',none:'隐藏'}[routeMode]);makeRoutes();};$('labels-toggle').onclick=()=>{labelsMode=!labelsMode;$('labels-toggle').textContent='标签：'+(labelsMode?'全部':'自动');refreshLOD();};$('growth').onclick=growth;$('clear-demo').onclick=()=>{setGraph(BASE);demo=0;$('demo-banner').hidden=true;$('clear-demo').hidden=true;solar();toast(`已回到原始 ${BASE.nodes.length} 个节点与 ${BASE.edges.length} 条超边。`);};$('close-panel').onclick=()=>document.body.classList.remove('panel-open');$('mobile-detail').onclick=()=>document.body.classList.add('panel-open');
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase(),nodes=model.nodes.filter(n=>(n.id+' '+n.label).toLowerCase().includes(q)),edges=model.edges.filter(e=>(e.id+' '+e.inputs.join(' ')+' '+e.output+' '+e.topic).toLowerCase().includes(q));$('search-results').hidden=!q;$('search-results').innerHTML=nodes.slice(0,18).map(n=>`<button data-n="${esc(n.id)}"><b>${esc(n.id)}</b>${esc(n.label)}</button>`).join('')+edges.slice(0,8).map(e=>`<button data-e="${esc(e.id)}"><b>航道 ${esc(e.id)} · ${esc(e.relation)}</b>${esc(e.inputs.join(' ∧ '))} → ${esc(e.output)}</button>`).join('');$('search-results').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.n)focus(b.dataset.n);else{selectEdge(b.dataset.e);const j=C.junction(model.edges.find(e=>e.id===b.dataset.e),model);camera(j.x,j.y,.85);}$('search-results').hidden=true;$('search').blur();});};document.addEventListener('keydown',e=>{if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('search').focus();}if(e.key==='Escape'){$('search-results').hidden=true;document.body.classList.remove('panel-open');}if(e.code==='Space'&&e.target===document.body){e.preventDefault();motion();}});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches&&running)motion();});window.addEventListener('resize',resizeStars);
buildFleetGallery();C.advanceSystems(model,systemSim,60);makeBackdrop();makeNavigation();makeNodes();buildSystemList();selectNode('R02');for(let i=0;i<220;i++)sim.tick();resizeStars();solar();syncMotion();requestAnimationFrame(loop);
window.cosmos={get graph(){return JSON.parse(JSON.stringify(model.graph));},get anchors(){return JSON.parse(JSON.stringify(model.anchors));},get systems(){return model.systems.map(s=>({id:s.id,x:s.x,y:s.y,radius:s.radius,bridges:C.crossSystemEdges(model,s.id).length}));},get state(){return{time:clock,running,speed,frames:frame,nodes:model.nodes.length,edges:model.edges.length,selected:{...selected},engine:'d3-force 3.x / D3 7.9.0'};},get positions(){return model.nodes.map(n=>({id:n.id,x:n.x,y:n.y,kind:n.kind,parent:n.orbit?.parent}));},updateGraph:setGraph,selectNode,selectEdge,focus,overview,solar,pause(){if(running)motion();},resume(){if(!running)motion();},growth,reset(){setGraph(BASE);demo=0;$('demo-banner').hidden=true;$('clear-demo').hidden=true;solar();}};
